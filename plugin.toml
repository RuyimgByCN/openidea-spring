id = "ruyimg.spring"
name = "Spring & Spring Boot"
version = "0.1.1"
description = "IntelliJ IDEA-aligned Spring & Spring Boot developer suite for OpenIDEA (zero duplication of built-in IDE Spring features): Bean DI index & interactive Dependency Graph, Core/Web/Data/Config/SpEL/Cron inspections & quick fixes, Constructor Injection refactoring, Spring Boot Config completion/hover/profile diff/YAML↔Properties converter, WebFlux & @HttpExchange endpoints, Spring Data JPA derived query engine & @Query SQL injection, 6-field Cron explainer, Services tool window, Actuator monitor, optional pure-Java Runtime Probe Agent, Console log highlighting, Datasource sync, and Spring templates."
authors = ["ruyimg"]
homepage = "https://github.com/RuyimgByCN/openidea-spring"
license = "Apache-2.0"
change-notes = "0.1.1 — Guard field-to-constructor injection refactoring against classes with existing constructors, Lombok constructor annotations, pre-initialized/final/volatile/multi-declarator fields, or `@Autowired(required = false)` so unsafe non-compiling edits are refused; upgrade YAML↔Properties conversion to structure-preserving AST conversion (`serde_yaml_ng`, indexed Spring keys such as `servers[0].host`, and `java.util.Properties`-compliant escaping) while refusing destructive edits on invalid/unsupported configs. 0.1.0 — Initial release: (1) Spring Core Bean DI cross-file index, gutter markers, Find Usages/Rename for Qualifiers/Events/Properties, interactive SVG Bean Dependency Graph, and Core inspections (missing/ambiguous/circular beans, field injection + Constructor Injection quick fix, @Transactional/@Async checks); (2) Spring Boot Config 180+ curated properties + metadata JSON + @ConfigurationProperties completion/hover/diagnostics, Status Bar active profile switcher, Effective Config explorer, native Profile Diff, YAML↔Properties converter, Kotlin/@ConditionalOnProperty navigation, and Maven/Gradle starter detection; (3) Spring WebFlux & @HttpExchange EndpointsProvider, Unified Endpoints Explorer, @PathVariable & duplicate-route inspections, cURL & full-URL helpers; (4) Spring Data JPA derived query validation/completion/JPQL preview, @Query SQL language injection & param checks, SpEL validator, and 6-field Spring Cron explainer; (5) Optional pure-Java loopback Runtime Probe Agent, live Actuator & Loggers control, Services tool window detail tabs, Run console highlight rules, one-click Datasource sync, and Spring file/live templates."
categories = ["frameworks", "tools"]
icon = "icons/spring.svg"
icon-dark = "icons/spring_dark.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = [
  "on-view:spring",
  "on-view:spring-services",
  "on-command:*",
  "on-language:java",
  "on-language:kotlin",
  "on-language:yaml",
  "on-language:properties",
  "on-event:settings-changed",
  "on-startup-finished",
]

[capabilities]
required = [
  "project.read",
  "editor.read",
  "editor.write",
  "build.read",
  "storage",
  "events",
  "clipboard",
]
optional = [
  "net:127.0.0.1",
  "net:localhost",
  "net:ask",
  "database.sources",
]

# Optional high-risk `java.agent` capability is derived automatically from this declaration.
[[contributes.javaAgents]]
path = "agent/openidea-spring-agent.jar"
args = "ports=47391-47398"

[[contributes.views]]
id = "spring"
title = "Spring"
icon = "icons/spring.svg"
location = "right"
secondary = true
web = "web/index.html"
header = "none"

[[contributes.views]]
id = "spring-services"
title = "Spring Boot"
icon = "icons/spring_boot.svg"
location = "services"

[[contributes.searchCategories]]
id = "spring-beans"
title = "Spring Beans"

[[contributes.searchCategories]]
id = "spring-config"
title = "Spring Config"

[[contributes.statusBar]]
id = "spring-profile"
text = "Spring"
tooltip = "Spring Active Profile & Tools"
command = "switch-profile"
align = "right"
priority = 95

[contributes.settings]
title = "Spring & Spring Boot"
schema = "settings.schema.json"

[[contributes.documentIndexers]]
extensions = ["java", "kt", "xml", "yml", "yaml", "properties"]

# Emits ONLY WebFlux functional routes & Spring 6 @HttpExchange HTTP interfaces
# so OpenIDEA's built-in Spring MVC route index is never duplicated.
[[contributes.endpoints]]
files = ["**/*.java", "**/*.kt"]

[[contributes.providers]]
kinds = [
  "completion",
  "definition",
  "line-markers",
  "code-actions",
  "hover",
  "inlay-hints",
  "diagnostics",
  "implementation",
  "gutter-actions",
  "injections",
  "document-links",
]
languages = ["java", "kotlin"]

[[contributes.providers]]
kinds = [
  "completion",
  "definition",
  "line-markers",
  "code-actions",
  "hover",
  "inlay-hints",
  "diagnostics",
  "document-links",
]
languages = ["yaml", "properties"]

[[contributes.providers]]
kinds = ["completion", "definition", "line-markers", "hover", "diagnostics", "document-links"]
languages = ["xml"]

[[contributes.markerIcons]]
id = "bean-inject"
icon = "icons/marker_bean.svg"
iconDark = "icons/marker_bean_dark.svg"
markers = ["bean-inject#"]
tooltip = "Navigate to Spring Bean injection points"

[[contributes.markerIcons]]
