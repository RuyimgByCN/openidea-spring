[[contributes.markerIcons]]
id = "event-listener"
icon = "icons/marker_event.svg"
iconDark = "icons/marker_event_dark.svg"
markers = ["event-listener#"]
tooltip = "Navigate to Spring Event listeners"

[[contributes.markerIcons]]
id = "config-prop"
icon = "icons/marker_config.svg"
iconDark = "icons/marker_config_dark.svg"
