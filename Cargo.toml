[package]
name = "openidea-spring"
version = "0.1.3"
edition = "2024"
description = "IntelliJ IDEA-aligned Spring & Spring Boot support for OpenIDEA: Beans DI & Dependency Graph, Boot Config & Profiles, WebFlux/HTTP Interface & Unified Endpoints Explorer, Spring Data JPA/SQL Injection/SpEL/Cron, Actuator & Services Integration, and Optional Pure-Java Runtime Probe Agent."
license = "Apache-2.0"
publish = false

# Standalone plugin repo built for wasm32-wasip2 outside the IDE workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.50" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
